<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="计算机知识库">
  <title>计算机知识库</title>
  <link rel="stylesheet" href="styles/tokens.css?v=202608260600">
  <link rel="stylesheet" href="styles/components.css?v=202608260600">
  <link rel="stylesheet" href="styles/responsive.css?v=202608260600">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('kb-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" title="打开导航" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <button class="icon-btn" id="sidebar-toggle-btn" type="button" title="折叠/展开侧栏" aria-label="折叠或展开侧栏" aria-controls="sidebar" aria-expanded="true" hidden>
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="7" y1="4" x2="7" y2="20"></line>
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <line x1="15" y1="9" x2="11" y2="12"></line>
          <line x1="15" y1="15" x2="11" y2="12"></line>
        </svg>
      </button>

      <a class="brand" href="#/" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </span>
        <span class="brand-text">
          <strong id="site-title">计算机知识库</strong>
          <small id="site-subtitle">前端 · 后端 · 基础 · 面试</small>
        </span>
      </a>

      <div class="search" id="search">
        <div class="searchbox">
          <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input id="search-input" type="search" placeholder="搜索文章、标签、内容..." autocomplete="off" spellcheck="false" aria-label="搜索">
          <kbd>Ctrl K</kbd>
        </div>
        <div class="search-results" id="search-results" hidden></div>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="theme-btn" type="button" title="切换主题" aria-label="切换主题"></button>
      </div>
    </div>
  </header>

  <div class="overlay" id="overlay" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="知识库导航"></aside>
    <div class="sidebar-resizer" id="sidebar-resizer" title="拖动调整侧栏宽度"></div>
    <main class="content" id="content" tabindex="-1"></main>
    <aside class="toc" id="toc" aria-label="文章目录"></aside>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <button class="back-to-top" id="back-to-top" type="button" title="回到顶部" aria-label="回到顶部">
    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m18 15-6-6-6 6"></path>
    </svg>
  </button>

  <script type="module" src="js/main.js?v=202608260600"></script>
</body>
</html>
